<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Altered Ownership</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="/config.js"></script>
    <script src="/js/bootstrap.js"></script>

    <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
    <header class="ao-header">
        <div class="ao-header-inner">
            <a class="ao-brand" href="/" title="Altered Ownership">
                <img src="/img/logo.png" alt="Altered Ownership" class="ao-logo">
                <span class="ao-brand-name">Altered Ownership</span>
            </a>

            <div class="ao-header-controls">
                <a class="ao-back-link" data-cfg-href="{reunionWebBase}/">
                    <i class="fa-solid fa-arrow-left"></i><span data-i18n="nav.back">Back to altered.re</span>
                </a>

                <div id="ao-auth-control"></div>
            </div>
        </div>
    </header>

    <main id="ao-main" class="container py-4">
        <h1 class="h3 mb-4" data-i18n="landing.title">Altered Ownership</h1>

        <div class="row g-3">
            <div class="col-12 col-md-4">
                <a class="btn btn-outline-primary w-100 h-100 py-4 d-flex flex-column align-items-center justify-content-center gap-2"
                   href="https://www.altered.re/pages/cards?tab=ownership">
                    <i class="fa-solid fa-layer-group fa-2x"></i>
                    <span data-i18n="landing.viewCollection">See my collection</span>
                </a>
            </div>
            <div class="col-12 col-md-4">
                <a class="btn btn-outline-primary w-100 h-100 py-4 d-flex flex-column align-items-center justify-content-center gap-2"
                   href="/history.html">
                    <i class="fa-solid fa-clock-rotate-left fa-2x"></i>
                    <span data-i18n="landing.history">History</span>
                </a>
            </div>
            <div class="col-12 col-md-4">
                <a class="btn btn-outline-primary w-100 h-100 py-4 d-flex flex-column align-items-center justify-content-center gap-2"
                   href="/import.html">
                    <i class="fa-solid fa-file-import fa-2x"></i>
                    <span data-i18n="landing.import">Import my Equinox collection</span>
                </a>
            </div>
            <div class="col-12 col-md-4">
                <a class="btn btn-outline-primary w-100 h-100 py-4 d-flex flex-column align-items-center justify-content-center gap-2"
                   href="/boosters.html">
                    <i class="fa-solid fa-gift fa-2x"></i>
                    <span data-i18n="landing.myBoosters">My boosters</span>
                </a>
            </div>
        </div>
    </main>

    <script src="/js/bootstrap.bundle.min.js"></script>
    <script src="/js/i18n.js" defer></script>
    <script src="/js/app.js" defer></script>
</body>
</html>

<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Altered Ownership — Admin récompenses</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="/config.js"></script>
    <script src="/js/bootstrap.js"></script>

    <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
    <header class="ao-header">
        <div class="ao-header-inner">
            <a class="ao-brand" href="/" title="Altered Ownership">
                <img src="/img/logo.png" alt="Altered Ownership" class="ao-logo">
                <span class="ao-brand-name">Altered Ownership — Admin</span>
            </a>

            <div class="ao-header-controls">
                <div id="ao-auth-control"></div>
            </div>
        </div>
    </header>

    <main id="ao-main" class="container py-4">
        <h1 class="h3 mb-4">Distribuer des cartes pour un événement</h1>

        <div id="ao-admin-denied" class="alert alert-warning" hidden>
            Vous devez être connecté avec un compte administrateur pour accéder à cette page.
        </div>

        <div id="ao-admin-content" hidden>
            <section class="card mb-4">
                <div class="card-body">
                    <h2 class="h5 card-title">Joueurs ciblés</h2>

                    <div class="input-group mb-2">
                        <input id="ao-search-input" type="text" class="form-control" placeholder="Email ou pseudo">
                        <button id="ao-search-btn" class="btn btn-outline-secondary" type="button">
                            <i class="fa-solid fa-magnifying-glass"></i> Rechercher
                        </button>
                    </div>
                    <div id="ao-search-results" class="list-group mb-3"></div>

                    <label for="ao-manual-ids" class="form-label small text-muted">
                        Ou coller des identifiants Keycloak (un par ligne)
                    </label>
                    <div class="input-group mb-3">
                        <textarea id="ao-manual-ids" class="form-control" rows="2"></textarea>
                        <button id="ao-manual-add-btn" class="btn btn-outline-secondary" type="button">Ajouter</button>
                    </div>

                    <div id="ao-targets" class="d-flex flex-wrap gap-2"></div>
                </div>
            </section>

            <section class="card mb-4">
                <div class="card-body">
                    <h2 class="h5 card-title">Récompense</h2>

                    <div class="btn-group mb-3" role="group">
                        <input type="radio" class="btn-check" name="ao-mode" id="ao-mode-card" autocomplete="off" checked>
                        <label class="btn btn-outline-primary" for="ao-mode-card">Carte spécifique</label>
                        <input type="radio" class="btn-check" name="ao-mode" id="ao-mode-unique" autocomplete="off">
                        <label class="btn btn-outline-primary" for="ao-mode-unique">Unique aléatoire</label>
                    </div>

                    <form id="ao-form-card" class="d-flex flex-column gap-3">
                        <div>
                            <label class="form-label" for="ao-card-reference">Référence de la carte</label>
                            <input id="ao-card-reference" type="text" class="form-control" required placeholder="ALT_CORE_B_AX_04_C">
                        </div>
                        <div>
                            <label class="form-label" for="ao-card-quantity">Quantité (par joueur)</label>
                            <input id="ao-card-quantity" type="number" min="1" value="1" class="form-control" required style="max-width: 10rem">
                        </div>
                        <div>
                            <label class="form-label" for="ao-card-acquired-from">Origine (nom de l'événement)</label>
                            <input id="ao-card-acquired-from" type="text" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary align-self-start">Donner la carte</button>
                    </form>

                    <form id="ao-form-unique" class="d-flex flex-column gap-3" hidden>
                        <div>
                            <label class="form-label" for="ao-unique-set">Set (optionnel, vide = tous les sets)</label>
                            <input id="ao-unique-set" type="text" class="form-control" placeholder="COREKS">
                        </div>
                        <div>
                            <label class="form-label" for="ao-unique-quantity">Quantité d'uniques (par joueur)</label>
                            <input id="ao-unique-quantity" type="number" min="1" value="1" class="form-control" required style="max-width: 10rem">
                        </div>
                        <div>
                            <label class="form-label" for="ao-unique-acquired-from">Origine (nom de l'événement)</label>
                            <input id="ao-unique-acquired-from" type="text" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary align-self-start">Donner des uniques aléatoires</button>
                    </form>

                    <div id="ao-form-status" class="mt-3" role="status" aria-live="polite"></div>
                </div>
            </section>

            <section id="ao-results-section" class="card mb-4" hidden>
                <div class="card-body">
                    <h2 class="h5 card-title">Résultat</h2>
                    <div class="table-responsive">
                        <table class="table table-sm">
                            <thead><tr><th>Joueur</th><th>Statut</th><th>Détail</th></tr></thead>
                            <tbody id="ao-results-body"></tbody>
                        </table>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script src="/js/bootstrap.bundle.min.js"></script>
    <script src="/js/admin-rewards.js" defer></script>
</body>
</html>

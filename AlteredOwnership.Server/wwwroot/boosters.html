<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Altered Ownership</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="/config.js"></script>
    <script src="/js/bootstrap.js"></script>

    <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
    <header class="ao-header">
        <div class="ao-header-inner">
            <a class="ao-brand" href="/" title="Altered Ownership">
                <img src="/img/logo.png" alt="Altered Ownership" class="ao-logo">
                <span class="ao-brand-name">Altered Ownership</span>
            </a>

            <div class="ao-header-controls">
                <a class="ao-back-link" href="/">
                    <i class="fa-solid fa-arrow-left"></i><span data-i18n="nav.backHome">Back</span>
                </a>

                <div id="ao-auth-control"></div>
            </div>
        </div>
    </header>

    <nav class="ao-nav">
        <div class="ao-nav-inner">
            <a class="ao-nav-link" href="/">
                <i class="fa-solid fa-layer-group"></i><span data-i18n="nav.collection">Collection</span>
            </a>
            <a class="ao-nav-link ao-nav-link--active" href="/boosters.html">
                <i class="fa-solid fa-gift"></i><span data-i18n="nav.boosters">Boosters</span>
                <span id="ao-nav-boosters-badge" class="ao-nav-badge" hidden>0</span>
            </a>
            <a class="ao-nav-link" href="/history.html">
                <i class="fa-solid fa-clock-rotate-left"></i><span data-i18n="nav.history">History</span>
            </a>
            <a class="ao-nav-link" href="/import.html">
                <i class="fa-solid fa-file-import"></i><span data-i18n="nav.import">Import</span>
            </a>
        </div>
    </nav>

    <main id="ao-main" class="container py-4">
        <h1 class="h3 mb-4" data-i18n="boosters.title">My boosters</h1>

        <div id="ao-boosters-anon" hidden>
            <a href="/api/auth/login?returnUrl=/boosters.html" class="btn btn-primary">
                <i class="fa-solid fa-user me-1"></i><span data-i18n="import.loginRegister">Log in / Sign up</span>
            </a>
        </div>

        <div id="ao-boosters-loading" class="text-muted" data-i18n="boosters.loading">Loading…</div>
        <div id="ao-boosters-empty" class="text-muted" hidden data-i18n="boosters.empty">No boosters to open.</div>
        <div id="ao-boosters-error" class="alert alert-danger" hidden></div>
        <div id="ao-boosters-grid" class="row g-3"></div>
    </main>

    <footer class="ao-footer">
        <img src="https://altered.re/uploads/editor/20260514_085456_96ed3e02.png" alt="Altered Fan Content" class="ao-footer-logo">
    </footer>

    <div id="ao-opener-backdrop" class="ao-opener-backdrop" hidden>
        <div class="ao-opener-stage">
            <div id="ao-opener-card" class="ao-opener-card ao-tilt-card"></div>
            <div id="ao-opener-cover" class="ao-opener-cover">
                <div id="ao-opener-rotator" class="ao-opener-cover-art"></div>
            </div>
            <div id="ao-opener-loading" class="ao-opener-loading" hidden>
                <span class="ao-opener-spinner" role="status" data-i18n-aria-label="boosters.loading" aria-label="Loading…"></span>
            </div>
            <button type="button" id="ao-opener-prev" class="ao-opener-nav ao-opener-nav--prev" data-i18n-aria-label="boosters.previousBooster" aria-label="Previous booster">‹</button>
            <button type="button" id="ao-opener-next" class="ao-opener-nav ao-opener-nav--next" data-i18n-aria-label="boosters.nextBooster" aria-label="Next booster">›</button>
        </div>
        <div id="ao-opener-info" class="ao-opener-info">
            <div>
                <div id="ao-opener-name" class="fw-semibold"></div>
                <div id="ao-opener-qty" class="text-white-50 small"></div>
            </div>
            <button type="button" id="ao-opener-open-btn" class="ao-opener-open-btn" data-i18n="boosters.open">Open</button>
        </div>
    </div>

    <script src="/js/bootstrap.bundle.min.js"></script>
    <script src="/js/card-renderer-loader.js"></script>
    <script src="/js/i18n.js" defer></script>
    <script src="/js/app.js" defer></script>
    <script src="/js/card-tilt.js" defer></script>
    <script src="/js/boosters.js" defer></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Altered Ownership</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="/config.js"></script>
    <script src="/js/bootstrap.js"></script>

    <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
    <header class="ao-header">
        <div class="ao-header-inner">
            <a class="ao-brand" href="/" title="Altered Ownership">
                <img src="/img/logo.png" alt="Altered Ownership" class="ao-logo">
                <span class="ao-brand-name">Altered Ownership</span>
            </a>

            <div class="ao-header-controls">
                <a class="ao-back-link" href="/">
                    <i class="fa-solid fa-arrow-left"></i><span data-i18n="nav.backHome">Back</span>
                </a>

                <div id="ao-auth-control"></div>
            </div>
        </div>
    </header>

    <main id="ao-main" class="container py-4">
        <h1 class="h3 mb-4" data-i18n="history.title">History</h1>

        <div id="ao-history-anon" hidden>
            <a href="/api/auth/login?returnUrl=/history.html" class="btn btn-primary">
                <i class="fa-solid fa-user me-1"></i><span data-i18n="import.loginRegister">Log in / Sign up</span>
            </a>
        </div>

        <div id="ao-history-loading" class="text-muted" data-i18n="history.loading">Loading…</div>
        <div id="ao-history-empty" class="text-muted" hidden data-i18n="history.empty">No events yet.</div>
        <div id="ao-history-error" class="alert alert-danger" hidden></div>
        <div id="ao-history-list" class="list-group"></div>
    </main>

    <div class="modal fade" id="ao-event-modal" tabindex="-1" aria-hidden="true" aria-labelledby="ao-event-modal-title">
        <div class="modal-dialog modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title h5" id="ao-event-modal-title"></h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="ao-event-modal-body"></div>
            </div>
        </div>
    </div>

    <div id="ao-card-zoom-backdrop" class="ao-opener-backdrop" hidden>
        <div class="ao-opener-stage">
            <div id="ao-card-zoom-content" class="ao-opener-card ao-tilt-card"></div>
        </div>
    </div>

    <script src="/js/bootstrap.bundle.min.js"></script>
    <script src="/js/card-renderer-loader.js"></script>
    <script src="/js/i18n.js" defer></script>
    <script src="/js/app.js" defer></script>
    <script src="/js/card-tilt.js" defer></script>
    <script src="/js/history.js" defer></script>
</body>
</html>
